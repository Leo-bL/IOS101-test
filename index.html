<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IOS101 - نظام التشغيل | اختبار</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f1115;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
width:min(900px,95%);
background:#1a1d24;
padding:22px;
border-radius:18px;
box-shadow:0 0 25px rgba(0,0,0,.4);
}

h1,h2{
text-shadow:0 0 10px rgba(255,255,255,.08);
}

.bar{
height:10px;
background:#2d313b;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:0%;
background:#9aa4b2;
transition:.2s;
}

.option{
width:100%;
padding:14px;
margin:8px 0;
border:none;
border-radius:12px;
background:#2a2f3a;
color:#fff;
cursor:pointer;
font-size:17px;
}

.option:hover{
background:#3a4150;
}

.correct{background:#1f6f43!important;}
.wrong{background:#8b2e2e!important;}

.controls{
display:flex;
gap:10px;
margin-top:15px;
}

button.nav{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#394150;
color:white;
cursor:pointer;
font-size:16px;
}

button.nav:hover{
background:#4a5468;
}

button:disabled{
opacity:0.4;
cursor:not-allowed;
}

.review-box{
margin:10px 0;
padding:10px;
background:#222;
border-radius:10px;
}
</style>
</head>
<body>

<div class="card" id="app"></div>

<script>

const questions = [
  { q: "التخزين المغناطيسي يتميز بـ:", a: ["كبير الحجم", "متطاير", "كبير الحجم + متطاير (الثنين سوا)", "صغير الحجم"], c: 2 },
  { q: "نظام وسادة الأمان في السيارة يعتمد على نمط المعالجة بالزمن القاسي (الصلب).", a: ["صح", "خطأ"], c: 0 },
  { q: "المردود (throughput) هو:", a: ["سرعة المعالج", "عدد الإجرائيات التي انتهت بواحدة زمنية", "حجم الذاكرة", "زمن استجابة"], c: 1 },
  { q: "البرنامج المسؤول عن إقالع التجهيزات وتحميل نظام التشغيل يسمى:", a: ["BIOS", "Loader", "bootstrap", "Kernel"], c: 2 },
  { q: "مسند المهام (Dispatcher) هو مكونة نظام التشغيل التي تقوم بتسليم تحكم المعالج إلى المهمة التي اختارها مجدول المعالج.", a: ["صح", "خطأ"], c: 0 },
  { q: "أي من التالي يعتبر حالة لاستدعاء مجدول المعالج قصير الأمد؟", a: ["تنفيذ ← انتظار (طلب دخل/خرج)", "تنفيذ ← جاهزية (مقاطعة)", "انتظار ← جاهزية (انتهاء دخل/خرج)", "جميع ما سبق"], c: 3 },
  { q: "تنفيذ المهمة يبدأ وينتهي بـ:", a: ["رشقة دخل/خرج", "رشقة معالج", "جميع ما سبق", "لا شيء"], c: 1 },
  { q: "المهمة المقيدة بوحدة المعالجة (CPU-bound) تستهلك:", a: ["عدداً قليلاً من رشقات المعالج الطويلة", "عدداً كبيراً من رشقات المعالج القصيرة", "رشقات دخل/خرج طويلة", "رشقات دخل/خرج قصيرة"], c: 0 },
  { q: "الخوارزمية المثلى (optimal) في جدولة المعالج هي:", a: ["FCFS", "SJF", "Round Robin", "Priority"], c: 1 },
  { q: "في نظام المشاركة بالزمن (Time Sharing) تبديل المعالج بين الإجراءات يكون بتواتر:", a: ["مرتفع", "منخفض", "متوسط", "لا يتغير"], c: 0 },
  { q: "نظم الزمن الحقيقي القاسي تتطلب دقة متناهية بالعمل.", a: ["صح", "خطأ"], c: 0 },
  { q: "النظام التفرعي (متعدد المعالجات) يمكن أن يكون:", a: ["متناظر فقط", "غير متناظر فقط", "متناظر أو غير متناظر (كليهما)", "لا شيء"], c: 2 },
  { q: "الإجراء (Process) هو برنامج يكون بحالة تنفيذ.", a: ["صح", "خطأ"], c: 0 },
  { q: "System call (استدعاءات النظام) هي:", a: ["لغة برمجة", "أدوات تؤمن الاتصال بين المهمة ونظام التشغيل", "مقاطعات عتادية", "سجلات المعالج"], c: 1 },
  { q: "برنامج الإقالع الرئيسي هو برنامج لإيجاد بداية نظام التشغيل أثناء الإقالع.", a: ["صح", "خطأ"], c: 0 },
  { q: "عداد البرنامج (Program Counter) يحدد العملية التالية التي يجب تنفيذها.", a: ["صح", "خطأ"], c: 0 },
  { q: "زمن الاستجابة هو الزمن الفاصل بين لحظة إعطاء أمر ولحظة أول استجابة.", a: ["صح", "خطأ"], c: 0 },
  { q: "نظام التشغيل من وجهة نظر المستخدم يصمم لتسهيل استخدام الحاسب دون التركيز على الاستفادة من الموارد.", a: ["صح", "خطأ"], c: 0 },
  { q: "عملية Swapping تعني:", a: ["الانتقال من الرام لمكان تخزين معطيات ثم العودة", "تبديل المعالج", "تبديل العمليات", "حذف الملفات"], c: 0 },
  { q: "طول المدخل بجدول FAT يحدد حجم الجدول.", a: ["صح", "خطأ"], c: 0 },
  { q: "في نموذج متعدد المعالج المتناظر، آلية عمله:", a: ["معالج رئيسي ومساعد", "كل معالج يشغل نسخة مطابقة من نظام التشغيل", "معالج واحد فقط يعمل", "معالجات متخصصة فقط"], c: 1 },
  { q: "يقوم نظام التشغيل بخدمة المهام عن طريق برامج النظام.", a: ["صح", "خطأ"], c: 0 },
  { q: "نظام الزمن الحقيقي يستخدم عندما نفرض قيوداً زمنية صارمة على عمل المعالج وتدفق المعطيات.", a: ["صح", "خطأ"], c: 0 },
  { q: "يرتبط المعالج مباشرة بالذاكرة الرئيسية فقط (بدون سجلات).", a: ["صح", "خطأ"], c: 1 },
  { q: "وظيفة متحكم الطرفية تشمل:", a: ["تنفيذ تعليمات الإدخال والإخراج", "استقبال أوامر وتنفيذ النقل الفيزيائي", "التحكم بالنقل بين الطرفية والذاكرة", "كل ما ذكر في 1،2،3 صحيح"], c: 3 },
  { q: "أي مما يلي صحيح بالنسبة للإدخال/الإخراج غير المتزامن؟", a: ["نقل التحكم للمهمة عند انتهاء عملية الإدخال والإخراج", "عودة التحكم مباشرة دون انتظار", "تنفيذ متسلسل", "لا شيء"], c: 0 },
  { q: "أين موقع طبقة نظام التشغيل؟", a: ["فوق العتاد وتحت البرامج", "فوق البرامج", "داخل المعالج فقط", "داخل الذاكرة فقط"], c: 0 },
  { q: "خطوات تنفيذ التعليمة من قبل المعالج هي:", a: ["استخلاص ← تحليل ← تنفيذ ← تخزين", "تحليل ← تنفيذ ← تخزين", "إحضار ← تنفيذ ← تخزين", "إحضار ← تحليل ← تنفيذ ← تخزين"], c: 3 },
  { q: "الاستثمار الأمثل للذاكرة نجده في:", a: ["نظم المهمات المتعددة", "نظم المهمة الواحدة", "نظم أقسام زمن المعالج", "كل ما ذكر"], c: 0 },
  { q: "ينفذ الحاسب عند تشغيله برنامج الإقالع ومن مهامه:", a: ["فحص سلامة العتاد", "تحديد مكان نواة النظام", "تهيئة السجلات والمتحكمات", "جميع ما سبق"], c: 3 },
  { q: "امتلاك كل معالج ذاكرة خاصة والتخاطب عبر الشبكة نجده في:", a: ["نظم تفرعية", "نظم موزعة", "نظم الزمن الحقيقي", "كل ما سبق"], c: 1 },
  { q: "يمكن رؤية نظام التشغيل على أنه:", a: ["برنامج تحكم بأجهزة الدخل والخرج", "مدير لعتاد الحاسب لخدمة برامج المستخدمين", "كل ما سبق صحيح", "كل ما سبق خاطئ"], c: 2 },
  { q: "متحكم الطرفية (البطاقة) هو دارة إلكترونية تتكون من سجلات وذاكرة وإدارة تحكم.", a: ["صح", "خطأ"], c: 0 },
  { q: "تعرف المهمة بأنها برنامج:", a: ["بالذاكرة المخفية", "على القرص الصلب وقيد التنفيذ", "بالذاكرة الرئيسية وقيد التنفيذ مع كل ما يلزمها", "بالسجلات فقط"], c: 2 },
  { q: "من وسائط التخزين المؤقتة للمعلومات:", a: ["المسجلات", "الذاكرة الرئيسية", "المسجلات والذاكرة (كليهما)", "الأقراص الصلبة"], c: 2 },
  { q: "النظام التفرعي (متعدد المعالجات) يكون:", a: ["متناظر", "غير متناظر", "كليهما", "لا شيء"], c: 2 },
  { q: "عدة مهام بالذاكرة ولكن واحدة بالتنفيذ نجده في:", a: ["نظم المهمة الواحدة", "نظم مهمات متعددة", "نظم اقتسام زمن المعالج", "كليهما"], c: 2 },
  { q: "توزيع الأعمال ومعالجتها على عدة مواقع لتنفيذها بالتوازي ذلك في:", a: ["نظم موزعة", "نظم تفرعية", "نظم زمن حقيقي", "كل ما سبق"], c: 0 },
  { q: "Bios هي:", a: ["ذاكرة قراءة فقط", "واجهة تفاعلية", "ذاكرة موجودة على اللوحة الأم", "برنامج تطبيقي"], c: 2 },
  { q: "المشكلة التي قد تحدث في خوارزمية الأولوية (Priority) هي:", a: ["الحرمان أو التوقف اللانهائي (Starvation)", "انتظار طويل", "تعقيد الحساب", "لا شيء"], c: 0 }
];

let i=0;
let selected=Array(questions.length).fill(null);
let wrong=[];

function render(){
  let q=questions[i];
  let progress=((i+1)/questions.length)*100;

  document.getElementById("app").innerHTML=`
    <div class="top">
      <span>السؤال ${i+1}/${questions.length}</span>
    </div>
    <div class="bar"><div class="fill" style="width:${progress}%"></div></div>
    <h2>${q.q}</h2>
    ${q.a.map((x,idx)=>`
      <button class="option ${selected[i]===idx?(idx===q.c?'correct':'wrong'):''}" onclick="pick(${idx})">
        ${x}
      </button>
    `).join("")}
    <div class="controls">
      <button class="nav" onclick="prev()">السابق</button>
      <button class="nav" onclick="next()" ${selected[i]===null?'disabled':''}>التالي</button>
    </div>
  `;
}

function pick(ans){
  if(selected[i]!==null) return;
  selected[i]=ans;
  render();
}

function next(){
  if(selected[i]===null) return;
  if(i<questions.length-1){
    i++;
    render();
  } else {
    finish();
  }
}

function prev(){
  if(i>0){
    i--;
    render();
  }
}

function finish(){
  let correct=0;
  wrong=[];
  questions.forEach((q,idx)=>{
    if(selected[idx]===q.c) correct++;
    else wrong.push(idx);
  });
  let score=Math.round(correct/questions.length*100);
  let msg = score>=46 ? "احسنت يا شطور!" : "لا تزعل بتترفع المرة الجاي";

  document.getElementById("app").innerHTML=`
    <h2>${msg}</h2>
    <p>الاجابات الصحيحة: ${correct}</p>
    <p>الاجابات الخاطئة: ${questions.length-correct}</p>
    <h2>العلامة: ${score}/100</h2>
    <div class="controls">
      <button class="nav" onclick="review()">مراجعة الاخطاء</button>
      <button class="nav" onclick="location.reload()">اعادة الاختبار</button>
    </div>
  `;
}

function review(){
  let html=`<h2>مراجعة الاخطاء</h2>`;
  if(wrong.length===0){
    html+=`<p>لا توجد اخطاء، كل الاجابات صحيحة.</p>`;
  } else {
    wrong.forEach(idx=>{
      let q=questions[idx];
      let correctAns = q.a[q.c];
      let userChoice = selected[idx]!==null ? q.a[selected[idx]] : "لم يجب";
      html+=`
        <div class="review-box">
          <b>${q.q}</b><br>
          <span style="color:#7ed6b0">الاجابة الصحيحة: ${correctAns}</span><br>
          <span style="color:#ff9f8f">اجابتك: ${userChoice}</span>
        </div>
      `;
    });
  }
  html+=`<button class="nav" onclick="location.reload()">العودة للاختبار</button>`;
  document.getElementById("app").innerHTML=html;
}

render();

</script>
</body>
</html>
