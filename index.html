<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IOS101 - اسئلة اختبار | نظام التشغيل </title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f1115;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px 0;
}

.card{
width:min(900px,95%);
background:#1a1d24;
padding:22px;
border-radius:18px;
box-shadow:0 0 25px rgba(0,0,0,.4);
margin-bottom:20px;
}

.bar{
height:10px;
background:#2d313b;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:0%;
background:#9aa4b2;
transition:.2s;
}

.option{
width:100%;
padding:14px;
margin:8px 0;
border:none;
border-radius:12px;
background:#2a2f3a;
color:#fff;
cursor:pointer;
font-size:17px;
}

.option:hover{
background:#3a4150;
}

.correct-highlight{background:#1f6f43!important;}
.wrong-highlight{background:#8b2e2e!important;}
.show-correct{background:#1f6f43!important;}

.controls{
display:flex;
gap:10px;
margin-top:15px;
}

button.nav{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#394150;
color:white;
cursor:pointer;
font-size:16px;
}

button.nav:hover{
background:#4a5468;
}

button:disabled{
opacity:0.4;
cursor:not-allowed;
}

.review-box{
margin:10px 0;
padding:10px;
background:#222;
border-radius:10px;
}

.footer{
margin-top:30px;
padding-top:15px;
border-top:1px solid #2d313b;
text-align:center;
font-size:14px;
color:#9aa4b2;
display:flex;
justify-content:center;
align-items:center;
gap:15px;  
flex-wrap:wrap;
}

.copyright{
font-size:14px;
color:#9aa4b2;
margin-bottom:10px;
}

.whatsapp-btn{
display:inline-block;
background:#25D366;
color:#fff;
text-decoration:none;
padding:6px 14px;
border-radius:30px;
font-size:13px;
transition:0.2s;
}

.whatsapp-btn:hover{
background:#128C7E;
}
</style>
</head>
<body>

<div class="card" id="app"></div>

<script>

// جميع الأسئلة المستخلصة من الملف (152 سؤالاً - ترتيب ثابت)
const questions = [
  { q: "التخزين المغناطيسي يتميز بـ:", a: ["كبير الحجم", "متطاير", "كبير الحجم + متطاير (الثنين سوا)", "صغير الحجم"], c: 2 },
  { q: "نظام وسادة الأمان في السيارة يعتمد على نمط المعالجة بالزمن القاسي (الصلب).", a: ["صح", "خطأ"], c: 0 },
  { q: "المردود (throughput) هو:", a: ["سرعة المعالج", "عدد العمليات التي انتهت بواحدة زمنية", "حجم الذاكرة", "زمن استجابة"], c: 1 },
  { q: "البرنامج المسؤول عن إقلاع التجهيزات وتحميل نظام التشغيل يسمى:", a: ["BIOS", "Loader", "bootstrap", "Kernel"], c: 2 },
  { q: "Dispatcher (منصب المهام) هو مكونة نظام التشغيل التي تقوم بتسليم تحكم المعالج إلى المهمة التي اختارها مجدول المعالج.", a: ["صح", "خطأ"], c: 0 },
  { q: "أي من التالي يعتبر حالة لاستدعاء مجدول المعالج قصير الأمد؟", a: ["تنفيذ ← انتظار (طلب دخل/خرج)", "تنفيذ ← جاهزية (مقاطعة)", "انتظار ← جاهزية (انتهاء دخل/خرج)", "جميع ما سبق"], c: 3 },
  { q: "تنفيذ المهمة يبدأ وينتهي بـ:", a: ["رشقة دخل/خرج", "رشقة معالج", "جميع ما سبق", "لا شيء"], c: 1 },
  { q: "المهمة المقيدة بوحدة المعالجة (CPU-bound) تستهلك:", a: ["عدداً قليلاً من رشقات المعالج الطويلة", "عدداً كبيراً من رشقات المعالج القصيرة", "رشقات دخل/خرج طويلة", "رشقات دخل/خرج قصيرة"], c: 0 },
  { q: "المهمة المقيدة بالدخل/الخرج (I/O-bound) تستهلك:", a: ["عدداً قليلاً من رشقات المعالج الطويلة", "عدداً كبيراً من رشقات المعالج القصيرة", "رشقات دخل/خرج طويلة", "رشقات دخل/خرج قصيرة"], c: 1 },
  { q: "الخوارزمية المثلى (optimal) في جدولة المعالج هي:", a: ["FCFS", "SJF", "Round Robin", "Priority"], c: 1 },
  { q: "في نظام المشاركة بالزمن (Time Sharing) تبديل المعالج بين الإجراءات يكون بتواتر:", a: ["مرتفع", "منخفض", "متوسط", "لا يتغير"], c: 0 },
  { q: "نظام المشاركة بالزمن يسمح لعدد مستخدمين بتشارك نفس الحاسب بنفس الوقت.", a: ["صح", "خطأ"], c: 0 },
  { q: "نظم الزمن الحقيقي القاسي تتطلب دقة متناهية بالعمل.", a: ["صح", "خطأ"], c: 0 },
  { q: "النظام متعدد المعالجات يمكن أن يكون:", a: ["متناظر فقط", "غير متناظر فقط", "متناظر أو غير متناظر (كليهما)", "لا شيء"], c: 2 },
  { q: "الإجراء (Process) هو برنامج يكون بحالة تنفيذ.", a: ["صح", "خطأ"], c: 0 },
  { q: "System call (استدعاءات النظام) هي:", a: ["لغة برمجة", "أدوات تؤمن الاتصال بين المهمة ونظام التشغيل", "مقاطعات عتادية", "سجلات المعالج"], c: 1 },
  { q: "برنامج الإقلاع الرئيسي هو برنامج لإيجاد بداية نظام التشغيل أثناء الإقلاع.", a: ["صح", "خطأ"], c: 0 },
  { q: "عداد البرنامج (Program Counter) يحدد العملية التالية التي يجب تنفيذها.", a: ["صح", "خطأ"], c: 0 },
  { q: "زمن الاستجابة هو الزمن الفاصل بين لحظة إعطاء أمر ولحظة أول استجابة.", a: ["صح", "خطأ"], c: 0 },
  { q: "تحقيق أكبر استفادة من العتاديات يوجد في:", a: ["Mainframe", "PC", "Handheld", "Embedded"], c: 0 },

  { q: "نظام التشغيل من وجهة نظر المستخدم يصمم لتسهيل استخدام الحاسب دون التركيز على الاستفادة من الموارد.", a: ["صح", "خطأ"], c: 0 },
  { q: "عملية Swapping تعني:", a: ["الانتقال من الرام لمكان تخزين معطيات ثم العودة", "تبديل المعالج", "تبديل العمليات", "حذف الملفات"], c: 0 },

  { q: "النظام الموزع يربط بين حواسيب مختلفة غير متجانسة.", a: ["صح", "خطأ"], c: 0 },

  { q: "أين موقع طبقة نظام التشغيل؟", a: ["فوق العتاد وتحت البرامج", "فوق البرامج", "داخل المعالج فقط", "داخل الذاكرة فقط"], c: 0 },
  { q: "خطوات تنفيذ التعليمة من قبل المعالج هي:", a: ["استخلاص ← تحليل ← تنفيذ ← تخزين", "تحليل ← تنفيذ ← تخزين", "إحضار ← تنفيذ ← تخزين", "إحضار ← تحليل ← تنفيذ ← تخزين"], c: 3 },
  { q: "الاستثمار الأمثل للذاكرة نجده في:", a: ["نظم المهمات المتعددة", "نظم المهمة الواحدة", "نظم أقسام زمن المعالج", "كل ما ذكر"], c: 0 },

  { q: "من وظائف موجه الطرفية:", a: ["نقل أوامر الإدخال والإخراج", "التحقق من جاهزية الطرفية", "نقل البارامترات", "التحقق من جاهزية ونقل البارامترات"], c: 3 },

  if(selected[i]!==null) return;
  selected[i]=ans;

}

function next(){
  if(selected[i]===null) return;
  if(i<questions.length-1){
    i++;
    render();
  } else {

  }
}

function prev(){
  if(i>0){
    i--;
    render();
  }
}

    if(selected[idx]===q.c) correct++;

  let score=Math.round(correct/questions.length*100);
